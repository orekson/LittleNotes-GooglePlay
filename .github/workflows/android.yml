name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [personal, play]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify ${{ matrix.flavor }} flavor
        run: >-
          bash ./gradlew
          test${{ matrix.flavor }}DebugUnitTest
          lint${{ matrix.flavor }}Debug
          assemble${{ matrix.flavor }}Debug
          assemble${{ matrix.flavor }}DebugAndroidTest
          --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-${{ matrix.flavor }}
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: LittleNotes-${{ matrix.flavor }}-debug-apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk
